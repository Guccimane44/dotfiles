name: Infrastructure checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/*.py
      - run: python3 scripts/skills-profile.py verify
      - run: python3 scripts/agent-expertise.py verify
      - run: python3 scripts/project-contract.py validate project.json
      - run: git diff --check
